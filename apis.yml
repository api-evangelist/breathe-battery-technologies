name: Breathe Battery Technologies
description: >-
  Breathe Battery Technologies is a UK battery software company, spun out of Imperial College
  London in 2019, that builds physics-based battery simulation, cell design, and adaptive
  charging software for OEM and cell engineering teams. Its API-delivered products — Breathe
  Design (cell design), Breathe Simulate (validated performance and degradation modelling), and
  Breathe Charge (embedded adaptive charging, shipped in Volvo EVs) — are consumed through
  first-party Python client libraries (breathe-simulate, breathe-design) and MATLAB/Simulink
  integration, backed by a token-authenticated cloud service. The company is venture-backed
  (Speedinvest among its investors) and profiled in the API Evangelist network for its
  developer-facing, programmatically accessible battery engineering platform.
