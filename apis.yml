apis:
- name: Breathe Simulate API
  description: >-
    API-delivered battery simulation service for predicting performance and degradation with
    validated physics-based cell models, and for retrieving and designing battery cell formats.
    Accessed through the first-party breathe-simulate Python client and MATLAB/Simulink blocks
    using token-based authentication; the REST base URL is provisioned per account (BD_* env
    var) and not published in the public docs.
